# Словарь нормализации навыков: каноническое название → синонимы.
#
# Как синонимы ищутся в тексте вакансии или резюме:
#   - синоним из одного символа (R, C) в тексте не ищется: только точное
#     совпадение в key_skills, иначе «R» найдётся в каждом «R&D»;
#   - синоним из двух символов (ML, Go, JS) ищется с учётом регистра;
#   - остальные — без учёта регистра, по границам слова;
#   - «*» — любое окончание слова: «статистик*» найдёт «статистики», «статистику».
# Каноническое название само считается синонимом.
#
# implies — что следует из навыка: кто пишет на PyTorch, знает Deep Learning; кто работает
# с PostgreSQL, знает SQL. Применяется только к резюме (что умеет кандидат), не к вакансиям.

